<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="airportGlow" cx="78%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#142821" />
      <stop offset="100%" stop-color="#091310" />
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#airportGlow)" />
  <g stroke="#22d398" stroke-opacity="0.07" stroke-width="1">
    <line x1="48" y1="68" x2="592" y2="68" />
    <line x1="48" y1="140" x2="592" y2="140" />
    <line x1="48" y1="212" x2="592" y2="212" />
    <line x1="48" y1="284" x2="592" y2="284" />
  </g>
  <rect x="48" y="48" width="544" height="172" rx="10" fill="#0f1e19" stroke="#22d398" stroke-opacity="0.24" stroke-width="1" />
  <text x="72" y="80" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#9eb7ad">bookings_db · consulta analítica</text>
  <line x1="72" y1="94" x2="568" y2="94" stroke="#9eb7ad" stroke-opacity="0.16" stroke-width="1" />
  <text x="72" y="122" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#22d398">SELECT a.model, COUNT(f.flight_id) AS vuelos</text>
  <text x="72" y="146" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#eef5f2">FROM flights f INNER JOIN aircrafts a USING (aircraft_code)</text>
  <text x="72" y="170" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#9eb7ad">WHERE actual_departure - scheduled_departure &gt; INTERVAL '1h'</text>
  <text x="72" y="194" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#22d398">GROUP BY a.model ORDER BY vuelos DESC;</text>

  <rect x="48" y="238" width="170" height="74" rx="10" fill="#142821" stroke="#9eb7ad" stroke-opacity="0.18" stroke-width="1" />
  <text x="66" y="266" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9eb7ad">RESERVAS</text>
  <text x="66" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#eef5f2">&gt; 1.000.000</text>

  <rect x="235" y="238" width="170" height="74" rx="10" fill="#142821" stroke="#9eb7ad" stroke-opacity="0.18" stroke-width="1" />
  <text x="253" y="266" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9eb7ad">FLOTA</text>
  <text x="253" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#22d398">JOIN + GROUP</text>

  <rect x="422" y="238" width="170" height="74" rx="10" fill="#142821" stroke="#9eb7ad" stroke-opacity="0.18" stroke-width="1" />
  <text x="440" y="266" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9eb7ad">RETRASOS</text>
  <text x="440" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#eef5f2">INTERVAL</text>
</svg>
